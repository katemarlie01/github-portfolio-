<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kate Marlie V. Vitalicio | Student Portfolio</title>
  
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* ==========================================
       RESET & GLOBAL STYLES
       ========================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #fffafc;
      color: #4a3e3d;
      line-height: 1.6;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ==========================================
       STICKY NAVIGATION BAR
       ========================================== */
    .navbar {
      position: sticky;
      top: 0;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid #fbcfe8;
      z-index: 1000;
      box-shadow: 0 2px 10px rgba(244, 114, 182, 0.1);
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
    }

    .logo {
      font-weight: 700;
      font-size: 1.2rem;
      color: #db2777;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 15px;
    }

    .nav-links a {
      text-decoration: none;
      color: #701a75;
      font-weight: 500;
      font-size: 0.9rem;
      transition: color 0.3s ease, transform 0.2s ease;
    }

    .nav-links a:hover {
      color: #ec4899;
      transform: translateY(-2px);
    }

    /* ==========================================
       HERO / PROFILE SECTION
       ========================================== */
    .hero-section {
      padding: 60px 20px;
      background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 50%, #f472b6 100%);
      text-align: center;
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
    }

    .hero-container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Floating animation for profile picture */
    .profile-img-container {
      position: relative;
      animation: float 4s ease-in-out infinite;
    }

    .profile-img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid #ffffff;
      box-shadow: 0 8px 25px rgba(219, 39, 119, 0.3);
    }

    .sparkle-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 1.8rem;
      animation: spin 3s infinite linear;
    }

    .hero-text h1 {
      font-size: 2.2rem;
      color: #831843;
      margin-bottom: 5px;
    }

    .welcome-text {
      font-size: 1.2rem;
      font-weight: 600;
      color: #be185d;
      margin-bottom: 10px;
    }

    .intro-text {
      font-size: 1rem;
      color: #4c0519;
      max-width: 600px;
      margin: 0 auto 20px auto;
    }

    .cta-btn {
      display: inline-block;
      padding: 10px 25px;
      background-color: #db2777;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 25px;
      box-shadow: 0 4px 15px rgba(219, 39, 119, 0.4);
      transition: all 0.3s ease;
    }

    .cta-btn:hover {
      background-color: #be185d;
      transform: scale(1.05);
    }

    /* ==========================================
       SECTIONS & CARDS
       ========================================== */
    .section {
      padding: 40px 0;
    }

    .section h2 {
      color: #9d174d;
      font-size: 1.6rem;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 16px;
      border: 1px solid #fbcfe8;
      box-shadow: 0 4px 15px rgba(244, 114, 182, 0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card p {
      margin-bottom: 12px;
    }

    .card p:last-child {
      margin-bottom: 0;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(244, 114, 182, 0.18);
    }

    .custom-list {
      list-style-type: '🌸 ';
      padding-left: 20px;
    }

    .custom-list li {
      margin-bottom: 10px;
      font-weight: 500;
    }
